<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Loan Calculator</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --primary:#2563eb;
  --text:#0f172a;
  --muted:#64748b;
  --border:#e5e7eb;
  --radius:14px;
  --shadow:0 10px 28px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
  color:var(--text);
}
h1{text-align:center;color:var(--primary);margin:22px 0}
.container{max-width:1200px;margin:auto;padding:16px}
.grid{display:grid;grid-template-columns:380px 1fr;gap:24px}
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:22px;
}
.section{margin-bottom:16px}
.section h3{color:var(--primary);font-size:16px;margin-bottom:10px}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
input,select{
  width:100%;padding:10px;border-radius:10px;
  border:1px solid var(--border);font-size:14px
}
button{
  padding:14px;border:none;border-radius:12px;
  font-weight:600;cursor:pointer
}
.primary{background:var(--primary);color:#fff}
.secondary{background:#eef2ff;margin-top:10px}

.results{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:16px
}
.result{
  background:#f8fafc;
  border-radius:12px;
  padding:14px;
  text-align:center
}
.result b{display:block;font-size:18px}

.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chart-box{height:220px}

.table-wrap{
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden
}
.table-scroll{max-height:360px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{background:#f1f5f9;position:sticky;top:0}
th,td{padding:8px;border-bottom:1px solid var(--border);text-align:right}
th:first-child,td:first-child{text-align:center}

@media(max-width:900px){
  .grid{grid-template-columns:1fr}
  .chart-row{grid-template-columns:1fr}
}
</style>
</head>

<body>
<h1>🚗 Car Loan Calculator</h1>

<div class="container">
<div class="grid">

<!-- LEFT -->
<div class="card">
<div class="section">
<h3>Currency</h3>
<select id="currency">
  <option value="USD">USD ($)</option>
  <option value="EUR">EUR (€)</option>
  <option value="GBP">GBP (£)</option>
  <option value="INR">INR (₹)</option>
</select>
</div>

<div class="section">
<h3>Vehicle Details</h3>
<label>Car Price</label><input id="price" value="30000">
<label>Down Payment</label><input id="down" value="3000">
<label>Trade-In Value</label><input id="trade" value="0">
<label>Sales Tax (%)</label><input id="tax" value="8">
</div>

<div class="section">
<h3>Loan Details</h3>
<label>APR (%)</label><input id="apr" value="5.5">
<label>Loan Term (Months)</label><input id="term" value="60">
<label>Additional Fees</label><input id="fees" value="500">
<label>Extra Monthly Payment</label><input id="extra" value="0">
</div>

<button class="primary" onclick="calculate()">Calculate Loan</button>
<button class="secondary" onclick="location.reload()">Reset</button>
</div>

<!-- RIGHT -->
<div class="card">

<div class="results">
  <div class="result"><b id="mPay">–</b><small>Monthly Payment</small></div>
  <div class="result"><b id="tInt">–</b><small>Total Interest</small></div>
  <div class="result"><b id="tCost">–</b><small>Total Cost</small></div>
  <div class="result"><b id="payoff">–</b><small>Payoff Month</small></div>
</div>

<div class="chart-row">
  <div class="chart-box"><canvas id="pie"></canvas></div>
  <div class="chart-box"><canvas id="line"></canvas></div>
</div>

<h3>Amortization Schedule</h3>
<div class="table-wrap">
<div class="table-scroll">
<table>
<thead>
<tr>
<th>Month</th><th>Payment</th><th>Interest</th><th>Principal</th><th>Balance</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>
</div>

</div>
</div>
</div>

<script>
let pieChart,lineChart;

function formatter(){
  const c=document.getElementById("currency").value;
  return new Intl.NumberFormat("en-US",{style:"currency",currency:c});
}

function calculate(){
const f=formatter();

const price=+priceEl.value;
const down=+downEl.value;
const trade=+tradeEl.value;
const tax=+taxEl.value/100;
const apr=+aprEl.value/100/12;
const term=+termEl.value;
const fees=+feesEl.value;
const extra=+extraEl.value;

let loan=(price-down-trade)*(1+tax)+fees;
let basePayment=loan*(apr*Math.pow(1+apr,term))/(Math.pow(1+apr,term)-1);

let balance=loan,totalInterest=0,rows="",month=0;
let balances=[];

while(balance>0 && month<600){
  month++;
  let interest=balance*apr;
  let payment=Math.min(basePayment+extra,balance+interest);
  let principal=payment-interest;

  balance=Math.max(balance-principal,0);
  totalInterest+=interest;

  balances.push(balance);

  rows+=`
  <tr>
    <td>${month}</td>
    <td>${f.format(payment)}</td>
    <td>${f.format(interest)}</td>
    <td>${f.format(principal)}</td>
    <td>${f.format(balance)}</td>
  </tr>`;
}

mPay.textContent=f.format(basePayment+extra);
tInt.textContent=f.format(totalInterest);
tCost.textContent=f.format(loan+totalInterest);
payoff.textContent="Month "+month;
table.innerHTML=rows;

pieChart?.destroy();
lineChart?.destroy();

pieChart=new Chart(pie,{
  type:"pie",
  data:{
    labels:["Principal","Interest"],
    datasets:[{data:[loan,totalInterest],
    backgroundColor:["#2563eb","#ef4444"]}]
  }
});

lineChart=new Chart(line,{
  type:"line",
  data:{
    labels:balances.map((_,i)=>"M"+(i+1)),
    datasets:[{
      label:"Remaining Balance",
      data:balances,
      borderColor:"#2563eb",
      tension:.3
    }]
  },
  options:{maintainAspectRatio:false}
});
}

const priceEl=price,downEl=down,tradeEl=trade,taxEl=tax,
aprEl=apr,termEl=term,feesEl=fees,extraEl=extra;

calculate();
</script>
</body>
</html>
