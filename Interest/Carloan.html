<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Loan Calculator</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#f5f7fb;
  --card:#fff;
  --primary:#2563eb;
  --text:#0f172a;
  --muted:#64748b;
  --border:#e5e7eb;
  --radius:14px;
  --shadow:0 12px 30px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
  color:var(--text);
}
h1{
  text-align:center;
  margin:22px 0;
  color:var(--primary);
}
.container{max-width:1200px;margin:auto;padding:16px}
.grid{display:grid;grid-template-columns:380px 1fr;gap:24px}
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:22px;
}
.section{margin-bottom:16px}
.section h3{margin:0 0 10px;color:var(--primary)}
label{font-size:12px;color:var(--muted)}
input,select{
  width:100%;
  padding:10px;
  border:1px solid var(--border);
  border-radius:10px;
  margin-bottom:8px;
}
button{
  padding:14px;
  border:none;
  border-radius:12px;
  font-weight:600;
  cursor:pointer;
}
.primary{background:var(--primary);color:#fff}
.secondary{background:#eef2ff;margin-top:10px}

.results{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:16px;
}
.result{
  background:#f8fafc;
  padding:14px;
  border-radius:12px;
  text-align:center;
}
.result b{font-size:18px}

.charts{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin-bottom:14px;
}
.chart-box{height:220px}

.print{
  width:100%;
  background:#0f172a;
  color:#fff;
  margin-bottom:14px;
}

.table-wrap{
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
}
.table-scroll{
  max-height:360px;
  overflow:auto;
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}
thead{
  background:#f1f5f9;
  position:sticky;
  top:0;
}
th,td{
  padding:8px;
  border-bottom:1px solid var(--border);
  text-align:right;
}
th:first-child,td:first-child{text-align:center}

@media(max-width:900px){
  .grid{grid-template-columns:1fr}
  .charts{grid-template-columns:1fr}
  .results{grid-template-columns:repeat(2,1fr)}
}
@media print{
  .charts,.print,button{display:none}
  body{background:#fff}
}
</style>
</head>

<body>
<h1>🚗 Car Loan Calculator</h1>

<div class="container">
<div class="grid">

<!-- LEFT -->
<div class="card">
<div class="section">
<h3>Currency</h3>
<select id="currency">
<option value="$">$ USD</option>
<option value="€">€ EUR</option>
<option value="£">£ GBP</option>
<option value="₹">₹ INR</option>
</select>
</div>

<div class="section">
<h3>Vehicle Details</h3>
<label>Car Price</label><input id="price" value="30000">
<label>Down Payment</label><input id="down" value="3000">
<label>Trade-In Value</label><input id="trade" value="0">
<label>Sales Tax (%)</label><input id="tax" value="8">
</div>

<div class="section">
<h3>Loan Details</h3>
<label>APR (%)</label><input id="apr" value="5.5">
<label>Loan Term (Months)</label><input id="term" value="60">
<label>Additional Fees</label><input id="fees" value="500">
<label>Extra Monthly Payment</label><input id="extra" value="0">
</div>

<button class="primary" onclick="calculate()">Calculate Loan</button>
<button class="secondary" onclick="location.reload()">Reset</button>
</div>

<!-- RIGHT -->
<div class="card">
<div class="results">
<div class="result"><b id="mp">–</b><small>Monthly</small></div>
<div class="result"><b id="ti">–</b><small>Interest</small></div>
<div class="result"><b id="tc">–</b><small>Total Cost</small></div>
<div class="result"><b id="pm">–</b><small>Payoff Month</small></div>
</div>

<div class="charts">
<div class="chart-box"><canvas id="pie"></canvas></div>
<div class="chart-box"><canvas id="line"></canvas></div>
</div>

<button class="print" onclick="window.print()">🖨️ Print Loan Summary</button>

<h3>Amortization Schedule</h3>
<div class="table-wrap">
<div class="table-scroll">
<table>
<thead>
<tr>
<th>Month</th><th>Payment</th><th>Interest</th><th>Principal</th><th>Balance</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>
</div>
</div>
</div>

</div>
</div>

<script>
let pieChart,lineChart;

function fmt(n){
  const s=document.getElementById("currency").value;
  return s+Math.round(n).toLocaleString();
}

function calculate(){
const price=+priceEl.value;
const down=+downEl.value;
const trade=+tradeEl.value;
const tax=+taxEl.value/100;
const apr=+aprEl.value/100/12;
const term=+termEl.value;
const fees=+feesEl.value;
const extra=+extraEl.value;

let loan=(price-down-trade);
loan+=loan*tax+fees;

let basePay=loan*(apr*Math.pow(1+apr,term))/(Math.pow(1+apr,term)-1);
let bal=loan,totalInt=0,month=0;
let rows="",balances=[];

while(bal>0 && month<600){
  month++;
  let interest=bal*apr;
  let payment=Math.min(basePay+extra,bal+interest);
  let principal=payment-interest;
  bal=Math.max(bal-principal,0);
  totalInt+=interest;
  balances.push(bal);
  rows+=`
  <tr>
    <td>${month}</td>
    <td>${fmt(payment)}</td>
    <td>${fmt(interest)}</td>
    <td>${fmt(principal)}</td>
    <td>${fmt(bal)}</td>
  </tr>`;
}

mp.textContent=fmt(basePay+extra);
ti.textContent=fmt(totalInt);
tc.textContent=fmt(loan+totalInt);
pm.textContent="Month "+month;
rowsEl.innerHTML=rows;

pieChart&&pieChart.destroy();
lineChart&&lineChart.destroy();

pieChart=new Chart(pieCtx,{
type:"pie",
data:{labels:["Principal","Interest"],
datasets:[{data:[loan,totalInt],backgroundColor:["#2563eb","#ef4444"]}]}
});

lineChart=new Chart(lineCtx,{
type:"line",
data:{labels:balances.map((_,i)=>"M"+(i+1)),
datasets:[{data:balances,borderColor:"#2563eb",tension:.3}]},
options:{maintainAspectRatio:false}
});
}

const priceEl=price,downEl=down,tradeEl=trade,taxEl=tax,aprEl=apr,termEl=term,feesEl=fees,extraEl=extra;
const pieCtx=document.getElementById("pie");
const lineCtx=document.getElementById("line");
const rowsEl=document.getElementById("rows");

calculate();
</script>
</body>
</html>
