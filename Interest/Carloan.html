<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Loan Calculator</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --primary:#2563eb;
  --text:#0f172a;
  --muted:#64748b;
  --border:#e5e7eb;
  --radius:14px;
  --shadow:0 10px 30px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
  color:var(--text);
}
h1{text-align:center;margin:22px 0;color:var(--primary)}
.container{max-width:1200px;margin:auto;padding:16px}
.grid{display:grid;grid-template-columns:380px 1fr;gap:24px}
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:22px;
  display:flex;
  flex-direction:column;
}
.section{margin-bottom:18px}
.section h3{margin:0 0 10px;color:var(--primary)}
label{font-size:12px;color:var(--muted)}
input{
  width:100%;padding:10px;border-radius:10px;
  border:1px solid var(--border);margin-top:4px
}
button{
  padding:14px;border:none;border-radius:12px;
  font-weight:600;cursor:pointer
}
.primary{background:var(--primary);color:#fff}
.secondary{background:#eef2ff;margin-top:10px}

.results{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:14px;margin-bottom:16px
}
.result-box{
  background:#f8fafc;border-radius:12px;
  padding:14px;text-align:center
}
.result-box b{font-size:18px;display:block}
.result-box small{color:var(--muted)}

.chart-wrap{height:260px}

.table-wrap{
  margin-top:14px;border:1px solid var(--border);
  border-radius:12px;overflow:hidden
}
.table-body{
  max-height:360px;
  overflow:auto
}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{background:#f1f5f9;position:sticky;top:0}
th,td{
  padding:8px;border-bottom:1px solid var(--border);
  text-align:right
}
th:first-child,td:first-child{text-align:center}

@media(max-width:900px){
  .grid{grid-template-columns:1fr}
  .results{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>
<h1>💼 Personal Loan Calculator</h1>

<div class="container">
<div class="grid">

<!-- LEFT -->
<div class="card">
<div class="section">
<h3>Loan Details</h3>

<label>Loan Amount</label>
<input id="amount" value="20000">

<label>Interest Rate (APR %)</label>
<input id="apr" value="8">

<label>Loan Term (Months)</label>
<input id="months" value="60">

<label>Origination Fee</label>
<input id="fee" value="0">

<label>Extra Monthly Payment (Optional)</label>
<input id="extra" value="0">
</div>

<button class="primary" onclick="calculate()">Calculate Loan</button>
<button class="secondary" onclick="location.reload()">Reset</button>
</div>

<!-- RIGHT -->
<div class="card">
<div class="results">
  <div class="result-box"><b id="rPay">–</b><small>Monthly Payment</small></div>
  <div class="result-box"><b id="rInt">–</b><small>Total Interest</small></div>
  <div class="result-box"><b id="rTot">–</b><small>Total Cost</small></div>
  <div class="result-box"><b id="rEnd">–</b><small>Payoff Month</small></div>
</div>

<div class="chart-wrap">
<canvas id="chart"></canvas>
</div>

<h3>Amortization Schedule</h3>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>Month</th>
<th>Payment</th>
<th>Interest</th>
<th>Principal</th>
<th>Balance</th>
</tr>
</thead>
<tbody class="table-body" id="table"></tbody>
</table>
</div>
</div>

</div>
</div>

<script>
let chart;

function money(n){
  return "$"+n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",");
}

function calculate(){
const P=+amount.value;
const r=+apr.value/100/12;
const n=+months.value;
const fee=+fee.value;
const extra=+extra.value;

const emi=P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);

let bal=P,month=0,totalI=0,totalPaid=0;
let rows=[],balances=[];

while(bal>0 && month<600){
  month++;
  let interest=bal*r;
  let principal=Math.min(emi+extra-interest,bal);
  let payment=interest+principal;

  bal-=principal;
  totalI+=interest;
  totalPaid+=payment;

  balances.push(bal);

  rows.push(`
  <tr>
    <td>${month}</td>
    <td>${money(payment)}</td>
    <td>${money(interest)}</td>
    <td>${money(principal)}</td>
    <td>${money(Math.max(bal,0))}</td>
  </tr>`);
}

rPay.textContent=money(emi);
rInt.textContent=money(totalI);
rTot.textContent=money(totalPaid+fee);
rEnd.textContent="Month "+month;
table.innerHTML=rows.join("");

if(chart)chart.destroy();
chart=new Chart(document.getElementById("chart"),{
  type:"line",
  data:{
    labels:balances.map((_,i)=>"M"+(i+1)),
    datasets:[{
      label:"Remaining Balance",
      data:balances,
      borderColor:"#2563eb",
      tension:.3
    }]
  },
  options:{responsive:true,maintainAspectRatio:false}
});
}

calculate();
</script>
</body>
</html>
