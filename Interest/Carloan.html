<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Loan Calculator</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --primary:#2563eb;
  --text:#0f172a;
  --muted:#64748b;
  --border:#e5e7eb;
  --radius:14px;
  --shadow:0 10px 30px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
  color:var(--text);
}
h1{
  text-align:center;
  margin:22px 0;
  color:var(--primary);
}
.container{
  max-width:1200px;
  margin:auto;
  padding:16px;
}
.grid{
  display:grid;
  grid-template-columns:380px 1fr;
  gap:24px;
  align-items:stretch;
}
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:22px;
  display:flex;
  flex-direction:column;
}
.section{margin-bottom:16px}
.section h3{
  margin:0 0 10px;
  font-size:16px;
  color:var(--primary);
}
label{
  font-size:12px;
  color:var(--muted);
  margin-bottom:4px;
  display:block;
}
input,select{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid var(--border);
  font-size:14px;
}
button{
  padding:14px;
  border:none;
  border-radius:12px;
  font-weight:600;
  cursor:pointer;
}
.primary{background:var(--primary);color:#fff}
.secondary{background:#eef2ff;margin-top:10px}

.results{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-bottom:16px;
}
.result-box{
  background:#f8fafc;
  border-radius:12px;
  padding:14px;
  text-align:center;
}
.result-box b{font-size:18px;display:block}
.result-box small{font-size:12px;color:var(--muted)}

.chart-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin-bottom:16px;
}
.chart-wrap{height:260px}

.table-wrap{
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  flex:1;
}
.table-wrap table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}
.table-wrap thead{
  background:#f1f5f9;
  position:sticky;
  top:0;
  z-index:1;
}
.table-wrap th, .table-wrap td{
  padding:8px;
  border-bottom:1px solid var(--border);
  text-align:right;
}
.table-wrap th:first-child,
.table-wrap td:first-child{ text-align:center }
.table-body{
  max-height:360px;
  overflow:auto;
}

@media(max-width:900px){
  .grid{grid-template-columns:1fr}
  .chart-row{grid-template-columns:1fr}
}
@media print{
  button, select, input{display:none}
  body{background:#fff}
}
</style>
</head>

<body>
<h1>🚗 Car Loan Calculator</h1>

<div class="container">
<div class="grid">

<!-- LEFT -->
<div class="card">
<div class="section">
<h3>Currency</h3>
<select id="currency">
  <option value="$">USD ($)</option>
  <option value="€">EUR (€)</option>
  <option value="£">GBP (£)</option>
  <option value="₹">INR (₹)</option>
</select>
</div>

<div class="section">
<h3>Vehicle Details</h3>
<label>Car Price</label><input id="price" value="30000">
<label>Down Payment</label><input id="down" value="3000">
<label>Trade-In Value</label><input id="trade" value="0">
<label>Sales Tax (%)</label><input id="tax" value="8">
</div>

<div class="section">
<h3>Loan Details</h3>
<label>APR (%)</label><input id="apr" value="5.5">
<label>Loan Term (Months)</label><input id="months" value="60">
<label>Additional Fees</label><input id="fees" value="500">
</div>

<button class="primary" onclick="calculate()">Calculate Loan</button>
<button class="secondary" onclick="location.reload()">Reset</button>
</div>

<!-- RIGHT -->
<div class="card">
<div class="results">
  <div class="result-box"><b id="rPay">–</b><small>Monthly Payment</small></div>
  <div class="result-box"><b id="rInterest">–</b><small>Total Interest</small></div>
  <div class="result-box"><b id="rTotal">–</b><small>Total Cost</small></div>
</div>

<div class="chart-row">
  <div class="chart-wrap"><canvas id="pie"></canvas></div>
  <div class="chart-wrap"><canvas id="line"></canvas></div>
</div>

<button class="secondary" onclick="window.print()">🖨️ Print Loan Summary</button>

<h3 style="margin:14px 0">Amortization Schedule</h3>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>Month</th>
<th>Payment</th>
<th>Interest</th>
<th>Principal</th>
<th>Balance</th>
</tr>
</thead>
<tbody class="table-body" id="table"></tbody>
</table>
</div>
</div>

</div>
</div>

<script>
let pieChart, lineChart;

function fmt(v){
  const c=document.getElementById("currency").value;
  return c+Math.round(v).toLocaleString();
}

function calculate(){
  const P = +price.value - +down.value - +trade.value;
  const taxAmt = P*(+tax.value/100);
  const loan = P + taxAmt + +fees.value;
  const r = (+apr.value/100)/12;
  const n = +months.value;

  const emi = loan*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);

  let bal=loan, rows="", totalInterest=0, balances=[];
  for(let m=1;m<=n;m++){
    const interest=bal*r;
    const principal=emi-interest;
    bal-=principal;
    totalInterest+=interest;
    balances.push(Math.max(bal,0));
    rows+=`<tr>
      <td>${m}</td>
      <td>${fmt(emi)}</td>
      <td>${fmt(interest)}</td>
      <td>${fmt(principal)}</td>
      <td>${fmt(bal)}</td>
    </tr>`;
  }

  rPay.textContent=fmt(emi);
  rInterest.textContent=fmt(totalInterest);
  rTotal.textContent=fmt(loan+totalInterest);
  table.innerHTML=rows;

  if(pieChart)pieChart.destroy();
  pieChart=new Chart(pie,{
    type:"pie",
    data:{
      labels:["Principal","Interest"],
      datasets:[{data:[loan,totalInterest],backgroundColor:["#2563eb","#ef4444"]}]
    }
  });

  if(lineChart)lineChart.destroy();
  lineChart=new Chart(line,{
    type:"line",
    data:{
      labels:balances.map((_,i)=>"M"+(i+1)),
      datasets:[{data:balances,label:"Remaining Balance",borderColor:"#2563eb",tension:.3}]
    },
    options:{maintainAspectRatio:false}
  });
}
calculate();
</script>
</body>
</html>
